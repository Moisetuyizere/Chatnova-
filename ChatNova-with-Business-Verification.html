    <!-- FIREBASE REAL-TIME CLOUD SYNC MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.cloudSync = {
            enabled: false,
            db: null,
            auth: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'chatnova-global-v1',
            async init() {
                try {
                    if (typeof __firebase_config === 'undefined' || !__firebase_config) {
                        window.updateSyncBadge('Local Multi-Tab Sync');
                        return;
                    }
                    const firebaseConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
                    const app = initializeApp(firebaseConfig);
                    this.auth = getAuth(app);
                    this.db = getFirestore(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(this.auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(this.auth);
                    }

                    if (!this.auth.currentUser) return;
                    this.enabled = true;
                    window.updateSyncBadge('Global Cloud Live');
                    this.bindRealtimeListeners();
                    this.pushInitialSeedIfNeeded();
                } catch (err) {
                    console.warn("Cloud sync fallback active:", err);
                    window.updateSyncBadge('Local Sync Mode');
                }
            },
            colRef(name) {
                return collection(this.db, 'artifacts', this.appId, 'public', 'data', name);
            },
            docRef(name, id) {
                return doc(this.db, 'artifacts', this.appId, 'public', 'data', name, String(id));
            },
            async pushDoc(colName, id, data) {
                if (!this.enabled || !this.auth?.currentUser) return;
                try {
                    await setDoc(this.docRef(colName, id), data, { merge: true });
                } catch (e) {
                    console.warn("Cloud write error:", e);
                }
            },
            async removeDoc(colName, id) {
                if (!this.enabled || !this.auth?.currentUser) return;
                try {
                    await deleteDoc(this.docRef(colName, id));
                } catch (e) {
                    console.warn("Cloud delete error:", e);
                }
            },
            async pushInitialSeedIfNeeded() {
                if (!this.enabled || !window.db) return;
                for (const u of window.db.users) await this.pushDoc('users', u.id, u);
                for (const p of window.db.posts) await this.pushDoc('posts', p.id, p);
            },
            bindRealtimeListeners() {
                // Users listener
                onSnapshot(this.colRef('users'), (snap) => {
                    if (snap.empty) return;
                    const cloudUsers = [];
                    snap.forEach(d => cloudUsers.push(d.data()));
                    if (cloudUsers.length > 0) {
                        window.mergeCloudCollection('users', cloudUsers);
                    }
                }, (err) => console.warn(err));

                // Posts listener
                onSnapshot(this.colRef('posts'), (snap) => {
                    const cloudPosts = [];
                    snap.forEach(d => cloudPosts.push(d.data()));
                    if (cloudPosts.length > 0) {
                        cloudPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        window.mergeCloudCollection('posts', cloudPosts);
                    }
                }, (err) => console.warn(err));

                // Messages listener
                onSnapshot(this.colRef('messages'), (snap) => {
                    const cloudMsgs = [];
                    snap.forEach(d => cloudMsgs.push(d.data()));
                    cloudMsgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    window.mergeCloudCollection('messages', cloudMsgs);
                }, (err) => console.warn(err));

                // Stories listener
                onSnapshot(this.colRef('stories'), (snap) => {
                    const cloudStories = [];
                    const now = Date.now();
                    snap.forEach(d => {
                        const s = d.data();
                        if (!s.expiresAt || s.expiresAt > now) cloudStories.push(s);
                    });
                    cloudStories.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    window.mergeCloudCollection('stories', cloudStories);
                }, (err) => console.warn(err));

                // Typing indicator listener
                onSnapshot(this.colRef('typing'), (snap) => {
                    const typingMap = {};
                    const now = Date.now();
                    snap.forEach(d => {
                        const tData = d.data();
                        if (tData.updatedAt && (now - tData.updatedAt) < 4500) {
                            typingMap[d.id] = tData;
                        }
                    });
                    window.typingStatusMap = typingMap;
                    if (window.currentTab === 'chat') window.render();
                }, (err) => console.warn(err));

                // Friend requests & notifications
                onSnapshot(this.colRef('friendRequests'), (snap) => {
                    const list = [];
                    snap.forEach(d => list.push(d.data()));
                    window.mergeCloudCollection('friendRequests', list);
                }, (err) => console.warn(err));

                onSnapshot(this.colRef('notifications'), (snap) => {
                    const list = [];
                    snap.forEach(d => list.push(d.data()));
                    window.mergeCloudCollection('notifications', list);
                }, (err) => console.warn(err));
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            window.cloudSync.init();
        });
    </script>

        // IndexedDB Wrapper for Voice & Media Blobs across multiple devices
        let idb = null;
        function initIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open('ChatNovaUltimateMediaDB', 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('media')) {
                        db.createObjectStore('media', { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => { idb = e.target.result; resolve(idb); };
                request.onerror = () => resolve(null);
            });
        }

        function saveBlobToIDB(id, blobData) {
            return new Promise((resolve) => {
                if(!idb) return resolve(null);
                const tx = idb.transaction('media', 'readwrite');
                const store = tx.objectStore('media');
                store.put({ id, data: blobData });
                tx.oncomplete = () => resolve(id);
                tx.onerror = () => resolve(null);
            });
        }

        function getBlobFromIDB(id) {
            return new Promise((resolve) => {
                if(!idb) return resolve(null);
                const tx = idb.transaction('media', 'readonly');
                const store = tx.objectStore('media');
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => resolve(null);
            });
        }

        // Convert uploaded 320470.jpg photo into square PWA icons for Manifest, Favicon & Apple Touch Icon
        function prepareOfficialAppLogo() {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const makeIcon = (size) => {
                            const canvas = document.createElement('canvas');
                            canvas.width = size;
                            canvas.height = size;
                            const ctx = canvas.getContext('2d');
                            const minDim = Math.min(img.width, img.height);
                            const sx = (img.width - minDim) / 2;
                            const sy = 0; // Top-aligned to preserve portrait framing
                            ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
                            return canvas.toDataURL('image/png');
                        };
                        const icon192 = makeIcon(192);
                        const icon512 = makeIcon(512);
                        resolvedAppLogoDataUrl = icon192;
                        document.getElementById('pwa-favicon').href = icon192;
                        document.getElementById('pwa-apple-icon').href = icon192;
                        resolve({ icon192, icon512, type: 'image/png' });
                    } catch (e) {
                        resolve({ icon192: OFFICIAL_LOGO_SRC, icon512: OFFICIAL_LOGO_SRC, type: 'image/jpeg' });
                    }
                };
                img.onerror = () => {
                    resolvedAppLogoDataUrl = FALLBACK_LOGO_SRC;
                    resolve({ icon192: FALLBACK_LOGO_SRC, icon512: FALLBACK_LOGO_SRC, type: 'image/png' });
                };
                img.src = OFFICIAL_LOGO_SRC;
            });
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(987.77, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}

            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-violet-600';
            toast.className = `${bg} text-white px-4 py-2.5 rounded-xl shadow-xl text-sm transition-all transform translate-y-2 opacity-0 flex items-center justify-between gap-3 pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);

        // Compress Image/Media on Device for Fast Real-Time Multi-Device Sync
        function compressImageFile(file, maxWidth = 800, quality = 0.72) {
            return new Promise((resolve) => {
                if (!file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve({ dataUrl: e.target.result, mediaType: file.type.startsWith('video/') ? 'video' : 'file' });
                    reader.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width;
                        let h = img.height;
                        if (w > maxWidth) {
                            h = Math.round((h * maxWidth) / w);
                            w = maxWidth;
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), mediaType: 'image' });
                    };
                    img.onerror = () => resolve({ dataUrl: e.target.result, mediaType: 'image' });
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

                const user = db.users.find(u => (u.phone === identifier || u.username.toLowerCase() === identifier) && u.password === pass);
                if (!user) { showToast('Invalid phone/username or password.', 'error'); return; }
                if (user.approved === false) { showToast('Account is currently suspended by Admin.', 'error'); return; }

                user.isOnline = true;
                user.lastSeen = 'Just now';

                window.session = user;

            document.getElementById('signup-form')?.addEventListener('submit', (e) => {
                e.preventDefault();

                const phone = document.getElementById('signup-phone').value.trim();

                if (!isValidPhone(phone)) { showToast('Invalid phone format.', 'error'); return; }
                if (password.length < 6) { showToast('Password must be at least 6 characters.', 'error'); return; }
                if (db.users.some(u => u.username.toLowerCase() === username)) { showToast('Username already taken.', 'error'); return; }

                session = newUser;
                window.session = newUser;
                saveDB('users', newUser);
                showToast(`Welcome to ChatNova, ${name}! Connected globally.`, 'success');
                render();

                e.preventDefault();

                const username = document.getElementById('forgot-username').value.trim().replace(/^@/, '').toLowerCase();
                const phone = document.getElementById('forgot-phone').value.trim();

                const user = db.users.find(u =>

                    u.phone.trim() === phone
                );

                if (!user) {

                    return;

                if (newPassword.length < 6) {

                    return;

                    return;

                user.password = newPassword;
                saveDB('users', user);
                showToast('Password successfully updated! You can now log in with your new password.', 'success');
                authMode = 'login';
                render();
            });

        async function handleDeviceStoryUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const caption = prompt('Add a caption to your story (optional):', '');
            showToast('Uploading story from your device...', 'info');
            const compressed = await compressImageFile(file, 720, 0.72);
            const newStory = {
                id: 's_' + Date.now(),
                userId: session.id,
                media: compressed.dataUrl,
                mediaType: compressed.mediaType,
                caption: caption || '',
                reactions: {},
                createdAt: Date.now(),
                expiresAt: Date.now() + (24 * 60 * 60 * 1000),
                time: 'Just now'
            };
            db.stories.unshift(newStory);
            saveDB('stories', newStory);
            render();
            showToast('Story published globally for 24 hours!', 'success');
        }

        function viewStory(id) {
            const idx = db.stories.findIndex(s => s.id === id);
            if (idx === -1) return;
            activeStoryIndex = idx;
            renderStoryViewerModal();
        }

        function closeStoryViewer() {
            activeStoryIndex = null;
            if (storyProgressTimer) clearTimeout(storyProgressTimer);
            const modal = document.getElementById('story-viewer-modal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                modal.innerHTML = '';
            }
        }

        function renderStoryViewerModal() {
            const modal = document.getElementById('story-viewer-modal');
            if (!modal || activeStoryIndex === null || !db.stories[activeStoryIndex]) {
                closeStoryViewer();
                return;
            }
            const story = db.stories[activeStoryIndex];
            const author = db.users.find(u => u.id === story.userId) || { name: 'User', username: 'user', avatar: FALLBACK_LOGO_SRC };
            const isVideo = story.mediaType === 'video' || (story.media && story.media.startsWith('data:video'));

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            modal.innerHTML = `
                <div class="w-full max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border border-slate-700 relative flex flex-col max-h-[90vh]">
                    <!-- Progress bars -->
                    <div class="flex gap-1 p-3 pb-1 z-20">
                        ${db.stories.map((_, i) => `
                            <div class="h-1 flex-1 rounded-full ${i <= activeStoryIndex ? 'bg-violet-500' : 'bg-white/30'}"></div>
                        `).join('')}
                    </div>
                    <!-- Header -->
                    <div class="px-4 py-2 flex items-center justify-between z-20 text-white">
                        <div class="flex items-center gap-2.5">
                            <img src="${author.avatar}" onerror="this.src='${FALLBACK_LOGO_SRC}'" class="w-9 h-9 rounded-full object-cover border border-violet-500">
                            <div>
                                <div class="text-sm font-bold leading-tight">${author.name}</div>
                                <div class="text-[11px] text-slate-300">${story.time || 'Just now'}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="downloadPicture('${story.media}', 'ChatNova_Story.jpg')" class="w-8 h-8 rounded-full bg-white/15 hover:bg-violet-600 flex items-center justify-center text-xs" title="Download Story"><i class="fa-solid fa-download"></i></button>
                            ${story.userId === session.id || session.role === 'admin' ? `<button onclick="deleteStory('${story.id}')" class="w-8 h-8 rounded-full bg-red-600/80 hover:bg-red-600 flex items-center justify-center text-xs" title="Delete Story"><i class="fa-solid fa-trash"></i></button>` : ''}
                            <button onclick="closeStoryViewer()" class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/30 flex items-center justify-center text-sm"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>

                    <!-- Story Media Canvas -->
                    <div class="relative flex-1 bg-black flex items-center justify-center min-h-[380px]">
                        ${isVideo
                            ? `<video src="${story.media}" controls autoplay class="max-h-[65vh] w-full object-contain"></video>`
                            : `<img src="${story.media}" class="max-h-[65vh] w-full object-contain">`
                        }
                        ${story.caption ? `
                            <div class="absolute bottom-3 inset-x-4 bg-black/65 backdrop-blur-sm text-white text-xs p-3 rounded-xl text-center">
                                ${story.caption}
                            </div>
                        ` : ''}
                        ${activeStoryIndex > 0 ? `<button onclick="activeStoryIndex--; renderStoryViewerModal();" class="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-violet-600"><i class="fa-solid fa-chevron-left"></i></button>` : ''}
                        ${activeStoryIndex < db.stories.length - 1 ? `<button onclick="activeStoryIndex++; renderStoryViewerModal();" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-violet-600"><i class="fa-solid fa-chevron-right"></i></button>` : ''}
                    </div>

                    <!-- Story Reply & Quick Reactions -->
                    <div class="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
                        <input type="text" id="story-reply-input" placeholder="Reply to ${author.name}'s story..." class="flex-1 bg-slate-800 text-white text-xs px-3.5 py-2.5 rounded-full outline-none focus:ring-1 focus:ring-violet-500" onkeydown="if(event.key==='Enter') sendStoryReply('${story.id}', '${author.id}')">
                        <button onclick="sendStoryReaction('${story.id}', '❤️')" class="text-lg hover:scale-125 transition">❤️</button>
                        <button onclick="sendStoryReaction('${story.id}', '🔥')" class="text-lg hover:scale-125 transition">🔥</button>
                        <button onclick="sendStoryReply('${story.id}', '${author.id}')" class="w-9 h-9 rounded-full bg-violet-600 text-white flex items-center justify-center text-xs"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
        }

        function deleteStory(storyId) {
            const target = db.stories.find(s => s.id === storyId);
            db.stories = db.stories.filter(s => s.id !== storyId);
            saveDB('stories', target, true);
            closeStoryViewer();
            render();
            showToast('Story deleted.', 'info');
        }

        function sendStoryReaction(storyId, emoji) {
            const story = db.stories.find(s => s.id === storyId);
            if (!story) return;
            if (!story.reactions) story.reactions = {};
            story.reactions[session.id] = emoji;
            saveDB('stories', story);
            showToast(`Reacted ${emoji} to story!`, 'success');
        }

        function sendStoryReply(storyId, authorId) {
            const input = document.getElementById('story-reply-input');
            const text = input ? input.value.trim() : '';
            if (!text) return;
            if (authorId !== session.id) {
                const msg = {
                    id: 'm_' + Date.now(),
                    senderId: session.id,
                    receiverId: authorId,
                    text: `[Story Reply] ${text}`,
                    type: 'text',
                    reactions: {},
                    createdAt: Date.now(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                db.messages.push(msg);
                saveDB('messages', msg);
            }
            input.value = '';
            showToast('Reply sent to conversation!', 'success');
        }

        async function handlePostGalleryUpload(event) {
            const files = event.target.files;
            if(files && files.length > 0) {
                for (const file of Array.from(files)) {
                    const compressed = await compressImageFile(file, 800, 0.75);
                    uploadedGalleryImages.push(compressed.dataUrl);
                }
                render();
            }
        }
        function removeGalleryImage(index) { uploadedGalleryImages.splice(index, 1); render(); }

        /* ==========================================================
           TAB 2: CHAT & MESSAGING WITH LIVE TYPING & REAL-TIME SYNC
           ========================================================== */
        let typingThrottleTimer = null;
        function notifyTyping() {
            if (!activeChatUserId || !window.cloudSync || !window.cloudSync.enabled) return;
            if (typingThrottleTimer) return;
            const key = `${session.id}_to_${activeChatUserId}`;
            window.cloudSync.pushDoc('typing', key, {
                fromId: session.id,
                toId: activeChatUserId,
                name: session.name,
                updatedAt: Date.now()
            });
            typingThrottleTimer = setTimeout(() => { typingThrottleTimer = null; }, 2000);
        }

        function renderChatTab() {
            const chatUsers = db.users.filter(u => u.id !== session.id && u.approved);
            const activeUser = db.users.find(u => u.id === activeChatUserId);
            
            let conversation = activeUser ? db.messages.filter(m => (m.senderId === session.id && m.receiverId === activeUser.id) || (m.senderId === activeUser.id && m.receiverId === session.id)) : [];
            if(chatSearchKeyword) {
                conversation = conversation.filter(m => m.text.toLowerCase().includes(chatSearchKeyword.toLowerCase()));
            }

            const currentDraft = (activeChatUserId && draftMessages[activeChatUserId]) ? draftMessages[activeChatUserId] : '';
            const activePins = pinnedMessages.map(id => db.messages.find(m => m.id === id)).filter(m => m && ((m.senderId === session.id && m.receiverId === activeChatUserId) || (m.senderId === activeChatUserId && m.receiverId === session.id)));
            const isPeerTyping = activeUser && window.typingStatusMap && window.typingStatusMap[`${activeUser.id}_to_${session.id}`];

            return `
                <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex h-[calc(100vh-10rem)]">
                    <!-- Sidebar Contacts -->
                    <div class="w-full md:w-80 border-r border-slate-200 dark:border-slate-700 flex flex-col ${activeChatUserId ? 'hidden md:flex' : 'flex'}">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-700">
                            <h2 class="font-bold text-lg mb-2">Messages</h2>
                            <input type="text" id="chat-search-user" placeholder="Search conversations..." class="w-full bg-slate-100 dark:bg-slate-700 px-3 py-2 rounded-lg text-sm outline-none focus:ring-1 focus:ring-violet-500">
                        </div>
                        <div class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700">
                            ${chatUsers.map(user => {
                                const lastMsg = db.messages.filter(m => (m.senderId === session.id && m.receiverId === user.id) || (m.senderId === user.id && m.receiverId === session.id)).pop();
                                return `
                                    <div onclick="selectChatUser('${user.id}')" class="p-3 flex items-center gap-3 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 transition ${activeChatUserId === user.id ? 'bg-violet-50 dark:bg-slate-700' : ''}">
                                        <div class="relative">
                                            <img src="${user.avatar}" onerror="this.src='${FALLBACK_LOGO_SRC}'" class="w-12 h-12 rounded-full object-cover">
                                            <span class="absolute bottom-0 right-0 w-3.5 h-3.5 ${user.isOnline ? 'bg-emerald-500' : 'bg-slate-400'} border-2 border-white dark:border-slate-800 rounded-full"></span>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center justify-between mb-0.5">
                                                <h4 class="font-bold text-sm truncate">${user.name}</h4>
                                                <span class="text-[10px] text-slate-400">${lastMsg ? lastMsg.time : ''}</span>
                                            </div>
                                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${lastMsg ? (lastMsg.type === 'voice' ? '🎤 Voice note' : lastMsg.text) : 'Tap to chat globally'}</p>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Chat Window -->
                    <div class="flex-1 flex flex-col bg-slate-50 dark:bg-slate-900 ${!activeChatUserId ? 'hidden md:flex' : 'flex'}">
                        ${activeUser ? `
                            <!-- Chat Header -->
                            <div class="bg-white dark:bg-slate-800 p-3 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <button onclick="activeChatUserId = null; render();" class="md:hidden text-slate-500 mr-2"><i class="fa-solid fa-arrow-left text-lg"></i></button>
                                    <img src="${activeUser.avatar}" onerror="this.src='${FALLBACK_LOGO_SRC}'" class="w-10 h-10 rounded-full object-cover">
                                    <div>
                                        <h3 class="font-bold text-sm">${activeUser.name}</h3>
                                        <span class="text-xs ${isPeerTyping ? 'text-violet-600 font-semibold animate-pulse' : (activeUser.isOnline ? 'text-emerald-500 font-medium' : 'text-slate-400')}">
                                            ${isPeerTyping ? 'Typing...' : (activeUser.isOnline ? 'Online' : `Last seen ${activeUser.lastSeen}`)}
                                        </span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <input type="text" id="msg-keyword-search" placeholder="Search keyword..." value="${chatSearchKeyword}" oninput="chatSearchKeyword = this.value; render();" class="bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg text-xs outline-none w-36 sm:w-48">
                                    <button onclick="toggleDisappearingTimer()" title="Disappearing Messages" class="w-9 h-9 rounded-full ${disappearingTimerMode > 0 ? 'bg-violet-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600'} flex items-center justify-center text-xs"><i class="fa-solid fa-stopwatch"></i></button>
                                </div>
                            </div>

                            <!-- Pinned Messages Banner -->
                            ${activePins.length > 0 ? `
                                <div class="bg-violet-50 dark:bg-violet-950/40 px-4 py-2 border-b border-violet-100 flex items-center justify-between text-xs">
                                    <div class="flex items-center gap-2 truncate">
                                        <i class="fa-solid fa-thumbtack text-violet-600"></i>
                                        <span class="font-bold text-violet-700">Pinned:</span>
                                        <span class="text-slate-600 truncate">${activePins[activePins.length - 1].text}</span>
                                    </div>
                                    <button onclick="unpinMessage('${activePins[activePins.length - 1].id}')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            ` : ''}

                            <!-- Messages Scroll Stream -->
                            <div class="flex-1 p-4 overflow-y-auto space-y-3" id="chat-messages-scroll">
                                ${conversation.length === 0 ? `<div class="text-center text-slate-400 my-auto text-sm">No messages yet. Say hello to ${activeUser.name}! 👋</div>` : ''}
                                ${conversation.map(msg => {
                                    const isMe = msg.senderId === session.id;
                                    const quotedMsg = msg.replyTo ? db.messages.find(m => m.id === msg.replyTo) : null;
                                    return `
                                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                                            <div class="max-w-[75%] rounded-2xl px-4 py-2.5 text-sm relative group shadow-sm ${isMe ? 'bg-violet-600 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-bl-none'}">
                                                
                                                ${quotedMsg ? `
                                                    <div class="mb-2 p-2 rounded-lg bg-black/10 text-xs border-l-2 border-white">
                                                        <span class="font-bold block">${quotedMsg.senderId === session.id ? 'You' : activeUser.name}</span>
                                                        <span class="truncate">${quotedMsg.text}</span>
                                                    </div>
                                                ` : ''}

                                                ${msg.type === 'voice' ? `
                                                    <div class="flex items-center gap-3">
                                                        <button onclick="playVoiceNote('${msg.mediaId}')" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-play"></i></button>
                                                        <div class="text-xs font-mono">Voice Message (0:12)</div>
                                                    </div>
                                                ` : msg.type === 'image' ? `
                                                    <div class="relative group/img mb-1">
                                                        <img src="${msg.media}" class="max-w-xs rounded-lg object-cover">
                                                        <button onclick="downloadPicture('${msg.media}', 'Chat_Image.jpg')" class="absolute bottom-2 right-2 bg-black/70 hover:bg-violet-600 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold flex items-center gap-1 shadow"><i class="fa-solid fa-download"></i> Download</button>
                                                    </div>
                                                    <p>${msg.text}</p>
                                                ` : `
                                                    <p class="whitespace-pre-line">${msg.text}</p>
                                                `}

                                                ${msg.reactions && Object.keys(msg.reactions).length > 0 ? `
                                                    <div class="absolute -bottom-2 ${isMe ? 'left-2' : 'right-2'} bg-white dark:bg-slate-700 shadow border rounded-full px-2 py-0.5 flex gap-1 text-xs">
                                                        ${Object.values(msg.reactions).join(' ')}
                                                    </div>
                                                ` : ''}

                                                <div class="text-[10px] ${isMe ? 'text-violet-200' : 'text-slate-400'} text-right mt-1 flex items-center justify-end gap-2">
                                                    <span>${msg.time}</span>
                                                    ${isMe ? '<i class="fa-solid fa-check-double text-emerald-400" title="Seen"></i>' : ''}
                                                    
                                                    <div class="opacity-0 group-hover:opacity-100 transition flex items-center gap-1.5 ml-1">
                                                        <button onclick="setReplyMessage('${msg.id}')" title="Reply"><i class="fa-solid fa-reply"></i></button>
                                                        <button onclick="forwardMessage('${msg.id}')" title="Forward"><i class="fa-solid fa-share"></i></button>
                                                        <button onclick="pinMessage('${msg.id}')" title="Pin"><i class="fa-solid fa-thumbtack"></i></button>
                                                        <button onclick="textToSpeech('${msg.text}')" title="Read Aloud"><i class="fa-solid fa-volume-high"></i></button>
                                                        <button onclick="translateMessage('${msg.id}')" title="Translate"><i class="fa-solid fa-language"></i></button>
                                                        ${isMe ? `<button onclick="editMessage('${msg.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>` : ''}
                                                        <button onclick="deleteMessage('${msg.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="flex gap-1 mt-1 text-xs opacity-80 hover:opacity-100 transition">
                                                <button onclick="reactMessage('${msg.id}', '❤️')" class="hover:scale-125 transition">❤️</button>
                                                <button onclick="reactMessage('${msg.id}', '😂')" class="hover:scale-125 transition">😂</button>
                                                <button onclick="reactMessage('${msg.id}', '👍')" class="hover:scale-125 transition">👍</button>
                                                <button onclick="reactMessage('${msg.id}', '😮')" class="hover:scale-125 transition">😮</button>
                                                <button onclick="reactMessage('${msg.id}', '🔥')" class="hover:scale-125 transition">🔥</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            ${replyToMsgId ? (() => {
                                const rMsg = db.messages.find(m => m.id === replyToMsgId);
                                return rMsg ? `
                                    <div class="bg-violet-100 dark:bg-slate-700 px-4 py-2 flex items-center justify-between text-xs border-t">
                                        <div class="flex items-center gap-2 truncate">
                                            <i class="fa-solid fa-reply text-violet-600"></i>
                                            <span class="font-bold">Replying to:</span>
                                            <span class="truncate">${rMsg.text}</span>
                                        </div>
                                        <button onclick="replyToMsgId = null; render();" class="text-slate-500 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                                    </div>
                                ` : '';
                            })() : ''}

                            <div class="bg-white dark:bg-slate-800 p-3 border-t border-slate-200 dark:border-slate-700 flex items-center gap-2">
                                <label class="cursor-pointer text-slate-500 hover:text-violet-600 p-2"><i class="fa-solid fa-paperclip text-lg"></i><input type="file" id="chat-file-input" class="hidden" onchange="sendChatAttachment(event)"></label>
                                <button onclick="startVoiceRecording()" class="text-slate-500 hover:text-violet-600 p-2" title="Voice Recording"><i class="fa-solid fa-microphone text-lg"></i></button>
                                <button onclick="scheduleMessagePrompt()" class="text-slate-500 hover:text-violet-600 p-2" title="Schedule Message"><i class="fa-solid fa-clock"></i></button>
                                <input type="text" id="chat-message-input" placeholder="Type a message..." value="${currentDraft}" oninput="saveDraft(this.value); notifyTyping();" class="flex-1 bg-slate-100 dark:bg-slate-700 px-4 py-2.5 rounded-full text-sm outline-none focus:ring-2 focus:ring-violet-500" onkeydown="if(event.key==='Enter') sendChatMessage()">
                                <button onclick="sendChatMessage()" class="w-10 h-10 bg-violet-600 hover:bg-violet-700 text-white rounded-full flex items-center justify-center shadow transition"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        ` : `
                            <div class="flex-1 flex flex-col items-center justify-center text-slate-400 p-6">
                                <div class="w-20 h-20 bg-violet-50 dark:bg-slate-800 rounded-full flex items-center justify-center text-violet-500 text-3xl mb-3 shadow"><i class="fa-solid fa-comments"></i></div>
                                <h3 class="font-bold text-lg text-slate-700 dark:text-slate-200">Select a conversation</h3>
                                <p class="text-xs text-slate-400 mt-1">Choose any global user from the sidebar to chat in real time.</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function selectChatUser(userId) {
            activeChatUserId = userId;
            replyToMsgId = null;
            chatSearchKeyword = '';
            render();
            setTimeout(() => {
                const sc = document.getElementById('chat-messages-scroll');
                if (sc) sc.scrollTop = sc.scrollHeight;
            }, 40);
        }
        function saveDraft(val) { if(activeChatUserId) { draftMessages[activeChatUserId] = val; localStorage.setItem('cn_drafts', JSON.stringify(draftMessages)); } }

        function sendChatMessage() {
            const input = document.getElementById('chat-message-input');
            const text = input ? input.value.trim() : '';
            if(!text || !activeChatUserId) return;

            const newMsg = {
                id: 'm_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                senderId: session.id,
                receiverId: activeChatUserId,
                text,
                type: 'text',
                replyTo: replyToMsgId,
                reactions: {},
                createdAt: Date.now(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            if(navigator.onLine) {
                db.messages.push(newMsg);
                playNotificationSound();
                saveDB('messages', newMsg);
                if (disappearingTimerMode > 0) {
                    setTimeout(() => deleteMessage(newMsg.id), disappearingTimerMode * 1000);
                }
            } else {
                db.offlineQueue.push(newMsg);
                saveDB();
                showToast('Offline: Message queued for sync.', 'error');
            }

            if(activeChatUserId) delete draftMessages[activeChatUserId];
            replyToMsgId = null;
            render();
            setTimeout(() => {
                const sc = document.getElementById('chat-messages-scroll');
                if (sc) sc.scrollTop = sc.scrollHeight;
            }, 40);
        }

        async function sendChatAttachment(e) {
            const file = e.target.files[0];
            if(!file || !activeChatUserId) return;
            const compressed = await compressImageFile(file, 720, 0.72);
            const newMsg = {
                id: 'm_' + Date.now(),
                senderId: session.id,
                receiverId: activeChatUserId,
                text: file.name,
                media: compressed.dataUrl,
                type: file.type.startsWith('image') ? 'image' : 'file',
                reactions: {},
                createdAt: Date.now(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            db.messages.push(newMsg);
            saveDB('messages', newMsg);
            render();
        }

        let mediaRecorder = null;
        let audioChunks = [];
        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const mediaId = 'audio_' + Date.now();
                    await saveBlobToIDB(mediaId, audioBlob);

                    const newMsg = {
                        id: 'm_' + Date.now(),
                        senderId: session.id,
                        receiverId: activeChatUserId,
                        text: 'Voice message',
                        mediaId,
                        type: 'voice',
                        reactions: {},
                        createdAt: Date.now(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    db.messages.push(newMsg);
                    saveDB('messages', newMsg);
                    render();
                    showToast('Voice message sent!', 'success');
                };
                mediaRecorder.start();
                showToast('Recording voice note...', 'info');
                setTimeout(() => {
                    if(mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        stream.getTracks().forEach(t => t.stop());
                    }
                }, 6000);
            } catch(err) {
                showToast('Microphone access denied.', 'error');
            }
        }

        async function playVoiceNote(mediaId) {
            const blob = await getBlobFromIDB(mediaId);
            if(blob) {
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
                showToast('Playing voice message...');
            } else {
                showToast('Voice blob not found.', 'error');
            }
        }

        function setReplyMessage(msgId) { replyToMsgId = msgId; render(); }
        function forwardMessage(msgId) {
            const msg = db.messages.find(m => m.id === msgId);
            const target = prompt('Enter exact username to forward to:');
            const found = db.users.find(u => u.username.toLowerCase() === (target || '').toLowerCase());
            if(found && msg) {
                const fwd = {
                    id: 'm_' + Date.now(),
                    senderId: session.id,
                    receiverId: found.id,
                    text: `[Forwarded] ${msg.text}`,
                    type: msg.type,
                    reactions: {},
                    createdAt: Date.now(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                db.messages.push(fwd);
                saveDB('messages', fwd);
                showToast('Message forwarded!', 'success');
            } else {
                showToast('User not found.', 'error');
            }
        }
        function pinMessage(msgId) { if(!pinnedMessages.includes(msgId)) { pinnedMessages.push(msgId); saveDB(); render(); showToast('Pinned!', 'success'); } }
        function unpinMessage(msgId) { pinnedMessages = pinnedMessages.filter(id => id !== msgId); saveDB(); render(); }
        function editMessage(msgId) {
            const msg = db.messages.find(m => m.id === msgId);
            const nt = prompt('Edit message:', msg.text);
            if(nt !== null) { msg.text = nt + ' (edited)'; saveDB('messages', msg); render(); }
        }
        function deleteMessage(msgId) {
            const target = db.messages.find(m => m.id === msgId);
            db.messages = db.messages.filter(m => m.id !== msgId);
            saveDB('messages', target, true);
            render();
        }
        function reactMessage(msgId, emoji) {
            const msg = db.messages.find(m => m.id === msgId);
            if(msg) { msg.reactions[session.id] = emoji; saveDB('messages', msg); render(); }
        }
        function textToSpeech(text) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
                showToast('Reading aloud...');
            }
        }
        function translateMessage(msgId) {
            const msg = db.messages.find(m => m.id === msgId);
            if(msg) { msg.text = `[Translated (${currentLang.toUpperCase()})] ${msg.text}`; saveDB('messages', msg); render(); showToast('Translated!', 'success'); }
        }
        function scheduleMessagePrompt() {
            const delay = prompt('Delay in seconds:', '10');
            const txt = prompt('Message text:', 'Reminder');
            if(delay && txt && activeChatUserId) {
                showToast(`Scheduled for ${delay}s.`, 'success');
                setTimeout(() => {
                    const sched = {
                        id: 'm_' + Date.now(),
                        senderId: session.id,
                        receiverId: activeChatUserId,
                        text: `[Scheduled] ${txt}`,
                        type: 'text',
                        reactions: {},
                        createdAt: Date.now(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };
                    db.messages.push(sched);
                    saveDB('messages', sched);
                    render();
                    showToast('Scheduled message delivered!', 'success');
                }, parseInt(delay) * 1000);
            }
        }
        function toggleDisappearingTimer() {
            disappearingTimerMode = disappearingTimerMode === 0 ? 60 : 0;
            showToast(`Disappearing mode ${disappearingTimerMode > 0 ? 'On (60s)' : 'Off'}`, 'success');
            render();
        }

        /* ==========================================================
           TAB 3: FRIENDS & COMMUNITY
           ========================================================== */
        function renderFriendsTab() {
            const allUsers = db.users.filter(u => u.id !== session.id && u.approved);
            const requests = db.friendRequests.filter(r => r.toId === session.id && r.status === 'pending');

            return `
                <div class="space-y-6">
                    ${requests.length > 0 ? `
                        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                            <h3 class="font-bold text-base mb-4"><i class="fa-solid fa-user-plus text-violet-600"></i> Friend Requests (${requests.length})</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${requests.map(req => {
                                    const fromUser = db.users.find(u => u.id === req.fromId) || { name: 'User', avatar: FALLBACK_LOGO_SRC };
                                    return `
                                        <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl flex items-center justify-between">
                                            <div class="flex items-center gap-3">
                                                <img src="${fromUser.avatar}" onerror="this.src='${FALLBACK_LOGO_SRC}'" class="w-12 h-12 rounded-full object-cover">
                                                <div><div class="font-bold text-sm">${fromUser.name}</div><div class="text-xs text-slate-400">@${fromUser.username}</div></div>
                                            </div>
                                            <div class="flex gap-2">
                                                <button onclick="acceptFriendRequest('${req.id}')" class="w-9 h-9 bg-emerald-600 text-white rounded-full flex items-center justify-center"><i class="fa-solid fa-check"></i></button>
                                                <button onclick="rejectFriendRequest('${req.id}')" class="w-9 h-9 bg-red-100 text-red-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-700">
                        <h3 class="font-bold text-base mb-4"><i class="fa-solid fa-globe text-violet-600"></i> Global Community (${allUsers.length} Connected Users)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${allUsers.map(user => {
                                const isFriend = session.friends.includes(user.id);
                                const isFollowing = session.following.includes(user.id);
                                return `
                                    <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl flex flex-col items-center text-center">
                                        <div class="relative">
                                            <img src="${user.avatar}" onerror="this.src='${FALLBACK_LOGO_SRC}'" class="w-20 h-20 rounded-full object-cover mb-3 border-2 border-violet-600 shadow">
                                            <span class="absolute bottom-3 right-1 w-4 h-4 ${user.isOnline ? 'bg-emerald-500' : 'bg-slate-400'} border-2 border-white rounded-full"></span>
                                        </div>
                                        <h4 class="font-bold text-base">${user.name} ${user.verified ? '<i class="fa-solid fa-circle-check text-violet-600 text-xs"></i>' : ''}</h4>
                                        <p class="text-xs text-slate-400 mb-2">@${user.username} • ${user.phone}</p>
                                        <p class="text-xs text-slate-600 dark:text-slate-300 mb-4 line-clamp-2">${user.bio}</p>
                                        <div class="flex gap-2 w-full">
                                            <button onclick="selectChatUser('${user.id}'); switchTab('chat');" class="px-3 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-white rounded-lg text-xs font-semibold hover:bg-violet-600 hover:text-white transition"><i class="fa-solid fa-comments"></i> Chat</button>
                                            <button onclick="toggleFollow('${user.id}')" class="flex-1 py-2 rounded-lg text-xs font-semibold ${isFollowing ? 'bg-slate-200 text-slate-700' : 'bg-violet-600 text-white shadow'}">${isFollowing ? 'Following' : 'Follow'}</button>
                                            ${!isFriend ? `<button onclick="sendFriendRequest('${user.id}')" class="px-3 py-2 bg-violet-50 text-violet-600 rounded-lg text-xs font-semibold">Add</button>` : `<span class="px-3 py-2 bg-emerald-50 text-emerald-600 rounded-lg text-xs font-semibold">Friend</span>`}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function sendFriendRequest(toId) {
            const fr = { id: 'fr_' + Date.now(), fromId: session.id, toId, status: 'pending' };
            const notif = { id: 'n_' + Date.now(), userId: toId, text: `${session.name} sent you a friend request.`, read: false, time: 'Just now' };
            db.friendRequests.push(fr);
            db.notifications.push(notif);
            saveDB('friendRequests', fr);
            saveDB('notifications', notif);
            render();
            showToast('Friend request sent!', 'success');
        }
        function acceptFriendRequest(reqId) {
            const req = db.friendRequests.find(r => r.id === reqId);
            if(req) {
                req.status = 'accepted';
                const u1 = db.users.find(u => u.id === req.fromId);
                const u2 = db.users.find(u => u.id === req.toId);
                if(u1 && u2) {
                    if (!u1.friends.includes(u2.id)) u1.friends.push(u2.id);
                    if (!u2.friends.includes(u1.id)) u2.friends.push(u1.id);
                    saveDB('users', u1);
                    saveDB('users', u2);
                }
                saveDB('friendRequests', req);
                render();
                showToast('Friend request accepted!', 'success');
            }
        }
        function rejectFriendRequest(reqId) {
            const req = db.friendRequests.find(r => r.id === reqId);
            db.friendRequests = db.friendRequests.filter(r => r.id !== reqId);
            saveDB('friendRequests', req, true);
            render();
        }
        function toggleFollow(userId) {
            if(session.following.includes(userId)) session.following = session.following.filter(id => id !== userId);
            else session.following.push(userId);
            saveDB('users', session);
            render();
        }
        function toggleBookmarkPost(postId) {
            const p = db.posts.find(x => x.id === postId);
            if(p) {
                if(!p.bookmarks) p.bookmarks = [];
                if(p.bookmarks.includes(session.id)) p.bookmarks = p.bookmarks.filter(id => id !== session.id);
                else p.bookmarks.push(session.id);
                saveDB('posts', p);
                render();
                showToast('Bookmarks updated');
            }
        }

        /* ==========================================================
           TAB 4: USER PROFILE
           ========================================================== */
        function renderProfileTab() {

        let verificationAuthMode = 'register';

            const headers={...(options.headers||{})};

            const r=await fetch(VERIFICATION_API+path,{...options,headers});
            const d=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(d.error||'Request failed');
            return d;

            if(u.role==='admin') {
              const d=await vApi('/admin/applications'), el=document.getElementById('v-admin-list'); if(!el)return;
              el.innerHTML='<h3 class="font-bold mb-4">Applications ('+d.applications.length+')</h3>'+(d.applications.length?d.applications.map(a=>`<article class="border dark:border-slate-700 rounded-xl p-4 mb-3"><div class="flex justify-between gap-2"><b>${vEsc(a.businessName)}</b><span class="text-xs font-bold text-blue-600">${vEsc(a.status)}</span></div><p class="text-xs text-slate-500">${vEsc(a.ownerName)} · ${vEsc(a.email)} · ${vEsc(a.country)}</p><p class="text-sm my-3">${vEsc(a.description)}</p><p class="text-xs text-slate-500">Reg: ${vEsc(a.registrationNumber||'—')} · ${vEsc(a.website||'')}</p><div class="flex flex-wrap gap-2 mt-3">${a.hasDocument?`<button onclick="vDocument('${a.id}')" class="bg-slate-100 dark:bg-slate-700 px-3 py-2 rounded text-xs">View document</button>`:''}<button onclick="vDecision('${a.id}','approved')" class="bg-blue-600 text-white px-3 py-2 rounded text-xs">Approve & verify</button><button onclick="vDecision('${a.id}','rejected')" class="bg-red-600 text-white px-3 py-2 rounded text-xs">Reject</button><button onclick="vDecision('${a.id}','needs_info')" class="bg-amber-100 text-amber-800 px-3 py-2 rounded text-xs">Request info</button></div></article>`).join(''):'<p class="text-sm text-slate-500">No applications yet.</p>');
            } else {
              const d=await vApi('/applications/me'), el=document.getElementById('v-user-panel'); if(!el)return;
              if(d.application){const a=d.application;el.innerHTML=`<h3 class="font-bold mb-3">Your application</h3><span class="rounded-full bg-blue-50 text-blue-700 px-3 py-1 text-xs font-bold">${vEsc(a.status)}</span>${a.status==='approved'?'<span class="ml-2 text-blue-600 font-bold"><i class="fa-solid fa-circle-check"></i> Verified by ChatNova</span>':''}<h4 class="font-semibold mt-4">${vEsc(a.businessName)}</h4><p class="text-sm text-slate-500">${vEsc(a.description)}</p><p class="text-xs text-slate-500 mt-3">Submitted ${new Date(a.createdAt).toLocaleString()}</p>${a.reviewNote?'<p class="bg-slate-50 dark:bg-slate-900 p-3 rounded mt-3 text-sm">Admin note: '+vEsc(a.reviewNote)+'</p>':''}`;
              } else {el.innerHTML=`<h3 class="font-bold text-lg mb-1">Apply for a blue verified badge</h3><p class="text-sm text-slate-500 mb-4">All applications are reviewed by an administrator.</p><form id="v-application" class="space-y-3">
                <input name="businessName" required maxlength="140" placeholder="Business name *" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600">
                <input name="ownerName" required maxlength="100" placeholder="Owner / representative name *" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600">
                <input name="email" type="email" required maxlength="254" placeholder="Business email *" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600">
                <input name="country" required maxlength="80" value="Rwanda" placeholder="Country *" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600">
                <textarea name="description" required minlength="30" maxlength="1500" rows="4" placeholder="Business description (at least 30 characters) *" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600"></textarea>
                <input name="registrationNumber" maxlength="100" placeholder="Business registration number (optional)" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600">
                <input name="website" type="url" maxlength="300" placeholder="Website URL (optional, include https://)" class="w-full border rounded-lg p-3 bg-slate-50 dark:bg-slate-900 dark:border-slate-600">
                <label class="block text-xs font-semibold">Supporting document (PDF, JPG or PNG; max 5 MB) *</label><input name="document" type="file" required accept=".pdf,.jpg,.jpeg,.png" class="w-full text-sm">
                <label class="flex gap-2 text-xs text-slate-500"><input name="consent" type="checkbox" required> I confirm that these details are accurate and authorize document review.</label>
                <button class="w-full bg-blue-600 text-white rounded-lg py-3 font-semibold">Submit application</button></form>`;}
            }
          } catch(e){const el=document.getElementById(u.role==='admin'?'v-admin-list':'v-user-panel');if(el)el.innerHTML='<p class="text-red-600 text-sm">'+vEsc(e.message)+'</p><button onclick="vLoad()" class="text-blue-600 text-sm mt-2">Retry</button>';}
        }
        async function vDocument(id){try{const r=await fetch(`${VERIFICATION_API}/admin/applications/${id}/document`,{headers:{Authorization:'Bearer '+vToken()}});if(!r.ok)throw Error('Document unavailable');const url=URL.createObjectURL(await r.blob());window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){showToast(e.message,'error');}}
        async function vDecision(id,status){const reviewNote=prompt('Optional note for the applicant:')||'';try{await vApi('/admin/applications/'+encodeURIComponent(id)+'/decision',{method:'PATCH',body:JSON.stringify({status,reviewNote})});showToast('Decision saved','success');vLoad();}catch(e){showToast(e.message,'error');}}
        async function vLogout(){try{await vApi('/auth/logout',{method:'POST'});}catch{}localStorage.removeItem(vTokenKey);localStorage.removeItem(vUserKey);render();}
        function attachVerificationEvents(){
          document.getElementById('v-auth-form')?.addEventListener('submit',async e=>{e.preventDefault();try{const body={email:document.getElementById('v-email').value.trim(),password:document.getElementById('v-password').value};if(verificationAuthMode==='register')body.name=document.getElementById('v-name').value.trim();const d=await vApi(verificationAuthMode==='register'?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(body)});localStorage.setItem(vTokenKey,d.token);localStorage.setItem(vUserKey,JSON.stringify(d.user));render();vLoad();}catch(err){showToast(err.message,'error');}});
          document.getElementById('v-application')?.addEventListener('submit',async e=>{e.preventDefault();try{await vApi('/applications',{method:'POST',body:new FormData(e.currentTarget)});showToast('Application submitted for admin review','success');render();vLoad();}catch(err){showToast(err.message,'error');}});
        }

        // Initialize Application
        window.onload = async function() {
            await setupPWAManifest();
            await initIndexedDB();
            render();
        };
    </script>
</body>
</html>
